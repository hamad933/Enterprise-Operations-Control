name: RP02 Application Completion Validation

on:
  pull_request:
    branches:
      - main
      - feature/rp02-portfolio-polish-001
    paths:
      - 'app/**'
      - 'tests/**'
      - 'docs/architecture/RP02_APP_COMPLETION.md'
      - '.github/workflows/rp02-app-completion-validation.yml'

permissions:
  contents: read

concurrency:
  group: rp02-completion-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  application-completion-browser:
    name: S01-S08 exact-head state and browser validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
      - name: Run Node syntax and state regressions
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/work-queue.js
          node --check app/completion-data.js
          node --check app/completion-state.js
          node --check app/completion-render.js
          node --check app/completion.js
          node --check tests/s02-browser.cjs
          node --check tests/completion-browser.cjs
          node tests/foundation.mjs
          node tests/s02.mjs
          node tests/completion.mjs
      - name: Install pinned ephemeral Playwright tooling
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact-head whole-application browser validation
        env:
          S02_BASE_URL: http://127.0.0.1:4173/app
          RP02_COMPLETION_BASE_URL: http://127.0.0.1:4173/app
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rp02-completion-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/app/index.html > /dev/null && break
            test "${attempt}" -lt 20 || { cat /tmp/rp02-completion-http.log; exit 1; }
            sleep 1
          done
          node tests/s02-browser.cjs
          node tests/completion-browser.cjs
