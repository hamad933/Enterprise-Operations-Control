name: RP02 Portfolio Polish Validation

on:
  pull_request:
    branches:
      - main
      - feature/rp02-portfolio-polish-001
    paths:
      - 'app/**'
      - 'tests/**'
      - 'docs/architecture/RP02_PORTFOLIO_POLISH.md'
      - '.github/workflows/rp02-portfolio-polish-validation.yml'

permissions:
  contents: read

concurrency:
  group: rp02-portfolio-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  portfolio-exact-head:
    name: S01-S08 portfolio exact-head quality validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify exact PR head and frozen prototype
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PROTOTYPE_BLOB: 649bc84678842ffcf3c22cc33a911ccce56c6b21
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git hash-object prototypes/rp02-s01/index.html)" = "${EXPECTED_PROTOTYPE_BLOB}"
      - name: Run source and functional regressions
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/work-queue.js
          node --check app/completion.js
          node --check app/portfolio-runtime.js
          node --check tests/s02-browser.cjs
          node --check tests/completion-browser.cjs
          node --check tests/portfolio-browser.cjs
          node --check tests/portfolio-capture.cjs
          node tests/foundation.mjs
          node tests/s02.mjs
          node tests/completion.mjs
      - name: Install pinned ephemeral browser tooling
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser regressions, six-size audit, and evidence capture
        env:
          S02_BASE_URL: http://127.0.0.1:4173/app
          RP02_COMPLETION_BASE_URL: http://127.0.0.1:4173/app
          RP02_PORTFOLIO_BASE_URL: http://127.0.0.1:4173
          RP02_PORTFOLIO_OUTPUT: portfolio-evidence
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rp02-portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/app/index.html > /dev/null && break
            test "${attempt}" -lt 20 || { cat /tmp/rp02-portfolio-http.log; exit 1; }
            sleep 1
          done
          node tests/s02-browser.cjs
          node tests/completion-browser.cjs
          node tests/portfolio-browser.cjs
          node tests/portfolio-capture.cjs
      - name: Upload portfolio screenshot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rp02-portfolio-final-${{ github.event.pull_request.head.sha }}
          path: portfolio-evidence/
          if-no-files-found: error
          retention-days: 30
