name: RP02 S02 Application Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'docs/architecture/RP02_APP_S02.md'
      - '.github/workflows/rp02-s02-validation.yml'

permissions:
  contents: read

concurrency:
  group: rp02-s02-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  s02-application-browser:
    name: S02 exact-head state and browser validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "Expected PR head: ${EXPECTED_HEAD}"
          echo "Checked out head:  ${ACTUAL_HEAD}"
          test "${ACTUAL_HEAD}" = "${EXPECTED_HEAD}"

      - name: Run S02 Node and state regressions
        run: |
          set -euo pipefail
          node --version
          node --check app/app.js
          node --check app/work-queue-data.js
          node --check app/work-queue-state.js
          node --check app/work-queue-render.js
          node --check app/work-queue.js
          node --check tests/s02-browser.cjs
          node tests/s02.mjs

      - name: Install pinned ephemeral Playwright tooling
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright --version
          npx playwright install --with-deps chromium

      - name: Run exact-head S02 browser validation
        env:
          S02_BASE_URL: http://127.0.0.1:4173/app
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rp02-s02-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/app/index.html > /dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              cat /tmp/rp02-s02-http.log
              exit 1
            fi
            sleep 1
          done

          node tests/s02-browser.cjs
