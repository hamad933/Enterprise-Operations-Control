name: RP02 Automation Foundation Tests

on:
  pull_request:
    paths:
      - "tools/rp02_automation/**"
      - "tests/rp02_automation/**"
      - "docs/automation/**"
      - ".github/workflows/rp02-automation-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact raw head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic foundation checks
        shell: bash
        run: bash tools/rp02_automation/setup.sh
      - name: Reject secret-like values in automation source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,})' tools/rp02_automation tests/rp02_automation docs/automation .github/workflows/rp02-automation-*.yml; then
            echo "Secret-like value detected in RP02 automation candidate."
            exit 1
          fi
